services:
  mongo:
    image: mongo:6
    container_name: realestate-mongo
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    ports:
      - "27017:27017"

  api:
    build:
      context: ./api
    container_name: realestate-api
    restart: unless-stopped
    env_file:
      # put DB URL, JWT secret etc in here
      - ./api/docker.env
    environment:
      # make sure your backend uses MONGO_URI from process.env
      - MONGO_URI=mongodb://mongo:27017/estate
      - PORT=5000
    depends_on:
      - mongo
    ports:
      - "5000:5000"

  client:
    build:
      context: ./client
    container_name: realestate-client
    restart: unless-stopped
    environment:
      # Frontend talks to backend through host port 5000
      - VITE_API_URL=http://localhost:5000
    depends_on:
      - api
    ports:
      - "5173:5173"

volumes:
  mongo_data:

