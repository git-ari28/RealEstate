events {}

http {
    server {
        listen 80;

        # Serve React build
        root /usr/share/nginx/html;
        index index.html;

        # Proxy requests starting with /api to backend container
        location /api/ {
            proxy_pass http://api:5000/;     # "api" = docker-compose service name
        }

        # React Router fallback
        location / {
            try_files $uri /index.html;
        }
    }
}
